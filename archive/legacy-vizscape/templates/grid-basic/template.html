<!DOCTYPE html>
<html lang="zh-CN" data-theme="__THEME__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · vizscape grid-basic</title>
<style>
__SHARED_CSS__
html[data-theme="light"]{--bg:#f6f3ec;--paper:#fffdf7;--ink:#171a1e;--muted:#6b6f6a;--faint:#9a9d96;--line:#e2ded2;--line2:#d1ccc0;--acc:#0f766e;--neg:#b5412f;--shadow:0 10px 36px rgba(23,26,30,.08);--grid:rgba(23,26,30,.06);--zebra:rgba(23,26,30,.025);--hover:rgba(15,118,110,.06)}
html[data-theme="dark"]{--bg:#0d0e0a;--paper:#131410;--ink:#ede9dc;--muted:#9aa08a;--faint:#5e6450;--line:#23261d;--line2:#2e3323;--acc:#c6f13f;--neg:#ff6b4a;--shadow:0 10px 36px rgba(0,0,0,.4);--grid:rgba(237,233,220,.05);--zebra:rgba(237,233,220,.03);--hover:rgba(198,241,63,.07)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
body{background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 28rem),radial-gradient(circle at 88% 4%,rgba(232,93,63,.08),transparent 30rem),var(--bg);color:var(--ink);font-family:var(--sans);padding:28px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;position:relative}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.seg.wrap{flex-wrap:wrap;border-radius:18px}
.chip{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;transition:.15s}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--paper);font-weight:700}
.chip:hover:not(.on){border-color:var(--acc);color:var(--acc)}
.chip.dim{color:var(--faint);text-decoration:line-through}
#search{appearance:none;border:1px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:13px;font-family:var(--sans);min-width:180px;outline:none}
#search:focus{border-color:var(--acc)}
.pager{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pager button{appearance:none;border:1px solid var(--line2);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--mono)}
.pager button:disabled{opacity:.35;cursor:default}
.table-scroll{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:14px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th{position:sticky;top:0;z-index:2;background:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--ink);white-space:nowrap;user-select:none}
table.grid th.num,table.grid td.num{text-align:right;font-family:var(--mono)}
table.grid td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.grid tbody tr:nth-child(even){background:var(--zebra)}
table.grid tbody tr:hover{background:var(--hover)}
table.grid th.sortable{cursor:pointer}
table.grid th.sortable:hover{color:var(--acc)}
table.grid th .arrow{color:var(--acc);margin-left:4px}
table.grid tr.subtotal td{border-top:1.5px solid var(--line2);font-family:var(--mono);font-size:12px;color:var(--muted);background:transparent}
table.grid tr.total td{border-top:2px solid var(--ink);font-weight:700;font-family:var(--mono);background:color-mix(in srgb,var(--acc) 6%,transparent)}
table.grid td.dimcell{color:var(--ink);font-weight:600}
.fadein{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#detail{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.8;min-height:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow">vizscape · grid-basic · __THEME_UPPER__</div><h1>__TITLE__ <em>· 动态表</em></h1></div>
  <div class="seg" id="themeSeg" role="group" aria-label="主题"><button type="button" data-theme="light" aria-pressed="false">☀ 浅色</button><button type="button" data-theme="dark" aria-pressed="false">☾ 深色</button></div>
</header>

<div class="deck">
  <div class="trow">
    <span class="label">视图</span>
    <div class="seg" id="modeSeg" role="group" aria-label="视图模式">
      <button type="button" data-mode="detail">▤ 明细</button>
      <button type="button" data-mode="pivot">⊞ 透视</button>
    </div>
    <input id="search" type="search" placeholder="🔍 搜索全部列…" aria-label="搜索">
    <span class="spacer"></span>
    <span class="pager" id="pager"><button type="button" id="pgPrev" aria-label="上一页">‹</button><span id="pgInfo">1/1</span><button type="button" id="pgNext" aria-label="下一页">›</button></span>
  </div>
  <div class="trow" id="pivotRow" hidden>
    <span class="label">透视</span>
    <span style="font-size:12px;color:var(--faint)">行</span><span id="rowChips"></span>
    <span style="font-size:12px;color:var(--faint)">列</span><span id="colChips"></span>
    <span style="font-size:12px;color:var(--faint)">值</span><span id="valChips"></span>
    <div class="seg" id="aggSeg" role="group" aria-label="聚合"><button type="button" data-agg="sum">Σ 求和</button><button type="button" data-agg="count"># 计数</button><button type="button" data-agg="avg">x̄ 均值</button><button type="button" data-agg="min">↓ 最小</button><button type="button" data-agg="max">↑ 最大</button></div>
  </div>
  <div class="trow" id="colRow" hidden>
    <span class="label">列显隐</span>
    <span id="colToggleChips"></span>
  </div>
  <div class="trow">
    <span class="label">风格</span>
    <div class="seg wrap" id="paletteSeg" role="group" aria-label="配色风格">
      <button type="button" data-palette="signal" class="on" aria-pressed="true">Signal</button>
      <button type="button" data-palette="cinnabar" aria-pressed="false">朱砂</button>
      <button type="button" data-palette="patina" aria-pressed="false">铜绿</button>
      <button type="button" data-palette="blueprint" aria-pressed="false">蓝图</button>
      <button type="button" data-palette="inkwash" aria-pressed="false">水墨</button>
      <button type="button" data-palette="mono" aria-pressed="false">单色</button>
      <button type="button" data-palette="sundown" aria-pressed="false">落日</button>
      <button type="button" data-palette="dunhuang" aria-pressed="false">敦煌</button>
      <button type="button" data-palette="aurora" aria-pressed="false">极光</button>
      <button type="button" data-palette="morandi" aria-pressed="false">莫兰迪</button>
    </div>
  </div>
</div>

<div class="summary" aria-label="摘要" id="summary"></div>

<div class="card">
  <div class="table-scroll"><table class="grid" id="grid" role="grid" aria-label="__TITLE__ 动态表"></table></div>
  <div id="detail"></div>
  <div class="hint">明细：点列头排序（升→降→原序），搜索跨全部列；透视：行维度最多 2 级（嵌套小计），列维度 1 级，五种聚合。空值显示 —。</div>
</div>

__QUALITY_HTML__

__TABLE_HTML__

<footer><span>vizscape · grid-basic · 动态表 / 多维透视 · 纯 DOM 无 Canvas</span><span>输入兼容：任意 csv / json / xlsx 表格 · 列类型自动识别</span></footer>
</div>

<script>
const RAW=__DATA_JSON__;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const COLS=RAW.columns, ROWS=RAW.rows, DIMS=RAW.dims, MEASURES=RAW.measures;
const KEYS=COLS.map(c=>c.key), ISNUM=Object.fromEntries(COLS.map(c=>[c.key,c.numeric]));
const PAGE=50;
let mode=RAW.mode, sortKey=null, sortDir=0, query='', hiddenCols=new Set(), page=0;
let rowDims=DIMS.slice(0,Math.min(2,DIMS.length)), colDim=null, measure=MEASURES[0]||null, agg='sum';

const grid=document.getElementById('grid'), detail=document.getElementById('detail');
const fmt=v=>v==null?'—':(Math.abs(v)>=1000?Math.round(v).toLocaleString():(Math.round(v*100)/100).toLocaleString());
const fmtI=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString():(Math.round(v*100)/100).toLocaleString();
function theme(){return document.documentElement.dataset.theme}
function setOn(el,on){el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on))}

// ---------- 汇总卡片 ----------
function renderSummary(){
  const items=[[RAW.n_rows,'行数'],[COLS.length,'列数'],[DIMS.length,'维度列'],[MEASURES.length,'数值列']];
  document.getElementById('summary').innerHTML=items.map(([v,l])=>`<span class="sum-card"><b>${fmtI(v)}</b> ${l}</span>`).join('');
}

// ---------- 明细模式 ----------
function detailRows(){
  let rows=ROWS;
  if(query){const q=query.toLowerCase();rows=rows.filter(r=>KEYS.some(k=>!hiddenCols.has(k)&&String(r[k]).toLowerCase().includes(q)))}
  if(sortKey&&sortDir){
    rows=rows.slice().sort((a,b)=>{
      const x=a[sortKey],y=b[sortKey];
      if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
      const c=ISNUM[sortKey]?x-y:String(x).localeCompare(String(y),'zh');
      return sortDir===1?c:-c;
    });
  }
  return rows;
}
function renderDetail(){
  const visKeys=KEYS.filter(k=>!hiddenCols.has(k));
  const rows=detailRows();
  const pages=Math.max(1,Math.ceil(rows.length/PAGE));
  page=Math.min(page,pages-1);
  const slice=rows.slice(page*PAGE,page*PAGE+PAGE);
  const arrow=k=>sortKey===k?`<span class="arrow">${sortDir===1?'↑':'↓'}</span>`:'';
  grid.innerHTML=`<thead><tr>${visKeys.map(k=>`<th class="sortable${ISNUM[k]?' num':''}" data-k="${esc(k)}">${esc(k)}${arrow(k)}</th>`).join('')}</tr></thead>
<tbody class="fadein">${slice.map(r=>`<tr>${visKeys.map(k=>`<td class="${ISNUM[k]?'num':''}">${ISNUM[k]?fmt(r[k]):esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody>`;
  document.getElementById('pgInfo').textContent=`${page+1}/${pages} · ${rows.length} 行`;
  document.getElementById('pgPrev').disabled=page<=0;
  document.getElementById('pgNext').disabled=page>=pages-1;
  detail.innerHTML=`▤ 明细模式 · 显示 <b>${slice.length}</b> / ${rows.length} 行${query?` · 搜索 <b>${esc(query)}</b>`:''}${sortKey?` · 按 <b>${esc(sortKey)}</b> ${sortDir===1?'升序':'降序'}`:''}${hiddenCols.size?` · 隐藏 ${hiddenCols.size} 列`:''}`;
}

// ---------- 透视模式 ----------
function aggregate(vals){
  if(agg==='count')return vals.length;
  const xs=vals.filter(v=>v!=null);
  if(!xs.length)return null;
  if(agg==='sum')return xs.reduce((a,b)=>a+b,0);
  if(agg==='avg')return xs.reduce((a,b)=>a+b,0)/xs.length;
  if(agg==='min')return Math.min(...xs);
  if(agg==='max')return Math.max(...xs);
  return null;
}
function pivotModel(){
  // rows: [{path:[d1,d2?], cells:Map<colKey, value>, total}]
  const colKeys=colDim?[...new Set(ROWS.map(r=>r[colDim]))].sort():[];
  const groups=new Map();
  for(const r of ROWS){
    const path=rowDims.map(d=>String(r[d]));
    const ck=colDim?String(r[colDim]):'';
    const gk=path.join('␀')+''+ck;
    if(!groups.has(gk))groups.set(gk,{path,ck,vals:[]});
    groups.get(gk).vals.push(r[measure]);
  }
  const byPath=new Map();
  for(const g of groups.values()){
    const pk=g.path.join('␀');
    if(!byPath.has(pk))byPath.set(pk,{path:g.path,cells:new Map(),all:[]});
    const bp=byPath.get(pk);
    bp.all.push(...g.vals);
    const key=g.ck||'';
    if(!bp.cells.has(key))bp.cells.set(key,[]);
    bp.cells.get(key).push(...g.vals);
  }
  let rows=[...byPath.values()].map(bp=>({
    path:bp.path,
    cells:colDim?colKeys.map(ck=>aggregate(bp.cells.get(ck)||[])):[aggregate(bp.all)],
    total:aggregate(bp.all),
  }));
  rows.sort((a,b)=>(b.total??-Infinity)-(a.total??-Infinity));
  return {colKeys,rows,grand:aggregate(ROWS.map(r=>r[measure]))};
}
function renderPivot(){
  if(!rowDims.length||!measure){grid.innerHTML='';detail.innerHTML='⊞ 透视需要 ≥1 行维度 + ≥1 数值列';return}
  const {colKeys,rows,grand}=pivotModel();
  const two=rowDims.length===2;
  // 两级行维度：按第一级分组，组间插小计
  let body='',i=0;
  const cellCls=v=>'';
  if(two){
    const groups=new Map();
    for(const r of rows){const k=r.path[0];if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
    for(const [gk,members] of groups){
      members.forEach((r,j)=>{
        body+=`<tr>${j===0?`<td class="dimcell" rowspan="${members.length}">${esc(gk)}</td>`:''}<td>${esc(r.path[1])}</td>${r.cells.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td class="num"><b>${fmt(r.total)}</b></td></tr>`;
      });
      const sub={};
      // 小计：该一级分组内成员按列聚合
      const subCells=colKeys.map((ck,ci)=>aggregate(members.map(m=>m.cells[ci]).filter(v=>v!=null)));
      const subTotal=aggregate(members.map(m=>m.total).filter(v=>v!=null));
      body+=`<tr class="subtotal"><td colspan="2">${esc(gk)} 小计</td>${subCells.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${fmt(subTotal)}</td></tr>`;
    }
  }else{
    body=rows.map(r=>`<tr><td class="dimcell">${esc(r.path[0])}</td>${r.cells.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td class="num"><b>${fmt(r.total)}</b></td></tr>`).join('');
  }
  // 合计行
  const tCells=colDim?colKeys.map(ck=>fmt(aggregate(ROWS.filter(r=>String(r[colDim])===ck).map(r=>r[measure])))):[fmt(grand)];
  body+=`<tr class="total"><td colspan="${two?2:1}">合计</td>${tCells.map(v=>`<td class="num">${v}</td>`).join('')}<td class="num">${fmt(grand)}</td></tr>`;
  const headDims=two?`<th>${esc(rowDims[0])}</th><th>${esc(rowDims[1])}</th>`:`<th>${esc(rowDims[0])}</th>`;
  const headCols=colDim?colKeys.map(ck=>`<th class="num">${esc(ck)}</th>`).join(''):`<th class="num">${esc(measure)}</th>`;
  grid.innerHTML=`<thead><tr>${headDims}${headCols}<th class="num">合计</th></tr></thead><tbody class="fadein">${body}</tbody>`;
  detail.innerHTML=`⊞ 透视模式 · 行 <b>${rowDims.map(esc).join(' › ')}</b>${colDim?` · 列 <b>${esc(colDim)}</b>`:''} · 值 <b>${esc(measure)}</b>（${{sum:'求和',count:'计数',avg:'均值',min:'最小',max:'最大'}[agg]}） · ${rows.length} 行组${colDim?` × ${colKeys.length} 列`:''} · 总计 <b>${fmt(grand)}</b>`;
}

// ---------- 透视控件 ----------
function renderPivotChips(){
  const chip=(d,on,extra='')=>`<button type="button" class="chip${on?' on':''}" ${extra}>${esc(d)}</button>`;
  document.getElementById('rowChips').innerHTML=DIMS.map(d=>chip(d,rowDims.includes(d),`data-rd="${esc(d)}"`)).join('');
  document.getElementById('colChips').innerHTML=DIMS.filter(d=>!rowDims.includes(d)).map(d=>chip(d,colDim===d,`data-cd="${esc(d)}"`)).join('');
  document.getElementById('valChips').innerHTML=MEASURES.map(m=>chip(m,measure===m,`data-vm="${esc(m)}"`)).join('');
  document.querySelectorAll('#aggSeg button').forEach(b=>setOn(b,b.dataset.agg===agg));
}
document.getElementById('pivotRow').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rd!==undefined){
    const d=b.dataset.rd;
    if(rowDims.includes(d)){rowDims=rowDims.filter(x=>x!==d)}
    else{if(rowDims.length>=2)rowDims.shift();rowDims.push(d);if(colDim===d)colDim=null}
  }else if(b.dataset.cd!==undefined){
    colDim=colDim===b.dataset.cd?null:b.dataset.cd;
  }else if(b.dataset.vm!==undefined){
    measure=b.dataset.vm;
  }else if(b.dataset.agg){
    agg=b.dataset.agg;
  }
  renderPivotChips();renderPivot();
});

// ---------- 列显隐 ----------
function renderColChips(){
  document.getElementById('colToggleChips').innerHTML=KEYS.map(k=>`<button type="button" class="chip${hiddenCols.has(k)?' dim':''}" data-col="${esc(k)}">${esc(k)}</button>`).join('');
}
document.getElementById('colRow').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.col===undefined)return;
  const k=b.dataset.col;hiddenCols.has(k)?hiddenCols.delete(k):hiddenCols.add(k);
  renderColChips();renderDetail();
});

// ---------- 模式切换 ----------
function applyMode(){
  document.querySelectorAll('#modeSeg button').forEach(b=>setOn(b,b.dataset.mode===mode));
  document.getElementById('pivotRow').hidden=mode!=='pivot';
  document.getElementById('colRow').hidden=mode!=='detail';
  document.getElementById('search').style.display=mode==='detail'?'':'none';
  document.getElementById('pager').style.display=mode==='detail'?'':'none';
  if(mode==='detail')renderDetail();else{renderPivotChips();renderPivot()}
}
document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;page=0;applyMode()});

// ---------- 明细交互 ----------
grid.addEventListener('click',e=>{
  const th=e.target.closest('th.sortable');if(!th)return;
  const k=th.dataset.k;
  if(sortKey!==k){sortKey=k;sortDir=1}else if(sortDir===1){sortDir=-1}else{sortKey=null;sortDir=0}
  page=0;renderDetail();
});
let searchTimer=null;
document.getElementById('search').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=e.target.value.trim();page=0;renderDetail()},180)});
document.getElementById('pgPrev').onclick=()=>{if(page>0){page--;renderDetail()}};
document.getElementById('pgNext').onclick=()=>{page++;renderDetail()};

document.getElementById('paletteSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.palette=b.dataset.palette;document.querySelectorAll('#paletteSeg button').forEach(x=>setOn(x,x===b))});
document.getElementById('themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.theme;document.querySelectorAll('#themeSeg button').forEach(x=>setOn(x,x===b))});
document.querySelectorAll('#themeSeg button').forEach(b=>setOn(b,theme()===b.dataset.theme));
renderSummary();renderColChips();applyMode();
</script>
</body>
</html>
