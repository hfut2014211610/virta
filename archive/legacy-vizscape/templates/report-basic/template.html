<!DOCTYPE html>
<html lang="zh-CN" data-theme="__THEME__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · vizscape report-basic</title>
<style>
__SHARED_CSS__
html[data-theme="light"]{--bg:#f6f3ec;--paper:#fffdf7;--ink:#171a1e;--muted:#6b6f6a;--faint:#9a9d96;--line:#e2ded2;--line2:#d1ccc0;--acc:#0f766e;--shadow:0 10px 36px rgba(23,26,30,.08);--grid:rgba(23,26,30,.06)}
html[data-theme="dark"]{--bg:#0d0e0a;--paper:#131410;--ink:#ede9dc;--muted:#9aa08a;--faint:#5e6450;--line:#23261d;--line2:#2e3323;--acc:#c6f13f;--shadow:0 10px 36px rgba(0,0,0,.4);--grid:rgba(237,233,220,.05)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
::selection{background:color-mix(in srgb,var(--acc) 24%,transparent)}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 28rem),radial-gradient(circle at 88% 4%,rgba(232,93,63,.08),transparent 30rem),var(--bg);color:var(--ink);font-family:var(--sans);padding:28px;min-height:100vh;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;position:relative}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.6vw,48px);letter-spacing:-.02em;line-height:1.1}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin:14px 0 4px}
.meta b{color:var(--ink)}
.deck{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px;margin:18px 0 6px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--acc)}
.kpi.inferred::before{background:var(--line2)}
.kpi-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag-inf{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:0 5px}
.kpi-val{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;word-break:break-all}
.kpi-val small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);margin-left:5px}
.kpi-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.kpi-bar i{display:block;height:100%;background:var(--acc)}
.kpi-src{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-decoration:none;display:block;margin-top:4px}
.kpi-src:hover{color:var(--acc)}
.empty{color:var(--muted);font-size:13px;margin:10px 0}
.quality.warn{border-left-color:#e85d3f}
.quality.warn .quality-score b{color:#e85d3f}
.quality-warnings{margin:11px 0 0;padding-left:18px;color:#b5412f;font-size:12px;line-height:1.75}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start;margin-top:28px}
.side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:6px}
.side-block{margin-bottom:26px}
.side-title{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.side-title span{color:var(--faint)}
.toc ol{list-style:none;padding:0}
.toc li a{display:block;padding:5px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;line-height:1.45;transition:background .2s,color .2s}
.toc li a:hover{color:var(--ink);background:var(--paper)}
.toc li a.active{color:var(--paper);background:var(--acc)}
.toc li.lv3 a{padding-left:24px;font-size:12.5px}
.toc li.lv1 a{font-weight:700}
.sb{margin:0 0 12px}
.sb a{display:block;font-size:12.5px;color:var(--ink);text-decoration:none;line-height:1.4}
.sb a:hover{color:var(--acc)}
.sb span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.sb-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.sb-track i{display:block;height:100%;background:var(--acc)}
.doc{max-width:760px;font-size:15px;min-width:0;transition:max-width .2s}
.doc.wide{max-width:940px}
.doc h2{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.02em;margin:48px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:24px;position:relative}
.doc h2:first-child{margin-top:0;border-top:0;padding-top:0}
.doc h3{font-family:var(--serif);font-size:21px;font-weight:420;margin:30px 0 8px;scroll-margin-top:24px;position:relative}
.doc h4{font-size:15px;font-weight:700;margin:22px 0 6px;scroll-margin-top:24px;position:relative}
.h-anchor{opacity:0;margin-left:.42em;color:var(--faint);font-family:var(--mono);font-size:.68em;font-weight:400;text-decoration:none;border:0;transition:opacity .15s;vertical-align:middle}
.doc h2:hover .h-anchor,.doc h3:hover .h-anchor,.doc h4:hover .h-anchor,.h-anchor:focus-visible{opacity:1}
.h-anchor:hover{color:var(--acc)}
.doc p{margin:12px 0}
.doc ul,.doc ol{padding-left:1.4em;margin:10px 0}
.doc li{margin:5px 0}
.doc li ul,.doc li ol{margin:4px 0}
.doc ul li::marker{color:var(--acc)}
.doc ol li::marker{color:var(--acc);font-family:var(--mono);font-size:.85em}
.doc strong{font-weight:700}
.doc del{color:var(--faint)}
.doc a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 35%,transparent);padding-bottom:1px;transition:background .15s,border-color .15s}
.doc a:hover{background:color-mix(in srgb,var(--acc) 10%,transparent);border-bottom-color:var(--acc)}
.doc hr{border:0;margin:34px 0;text-align:center}
.doc hr::before{content:"✦ ✦ ✦";color:var(--faint);font-size:10px;letter-spacing:1.2em;padding-left:1.2em}
.doc blockquote{position:relative;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 5%,var(--paper));border-radius:0 14px 14px 0;padding:14px 18px 14px 44px;color:var(--muted);margin:20px 0}
.doc blockquote::before{content:"“";position:absolute;left:13px;top:0;font-family:var(--serif);font-size:42px;line-height:1;color:color-mix(in srgb,var(--acc) 45%,transparent)}
.doc blockquote p{margin:4px 0}
.doc code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--acc) 9%,var(--paper));border:1px solid color-mix(in srgb,var(--acc) 22%,transparent);color:#b5412f;padding:.12em .45em;border-radius:6px;white-space:break-spaces}
html[data-theme="dark"] .doc code{color:#ff9d8a}
.codeblock{margin:20px 0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#15181c;border:1px solid #23282e}
.code-head{display:flex;align-items:center;gap:9px;padding:7px 12px;background:#1b2026;border-bottom:1px solid #23282e;user-select:none}
.code-head .dots{display:flex;gap:5px}
.code-head .dots i{width:9px;height:9px;border-radius:50%;background:#2e3640}
.code-head .dots i:first-child{background:#e0655f}
.code-head .dots i:nth-child(2){background:#e0a94a}
.code-head .dots i:last-child{background:#56c08a}
.code-head .lang{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8b929c}
.code-head .sp{flex:1}
.cb-btn{appearance:none;border:1px solid #2e3640;background:transparent;color:#8b929c;border-radius:6px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;cursor:pointer;transition:color .15s,border-color .15s}
.cb-btn:hover{color:#e4e7eb;border-color:#3a4149}
.cb-btn.on{color:#7dcfff;border-color:rgba(125,207,255,.4)}
.code-body{margin:0;padding:10px 0 12px;overflow-x:auto;counter-reset:cl}
.code-body code{display:block;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#d7dbe2;background:none;border:0;padding:0;white-space:pre;tab-size:2}
.code-body.wrap code{white-space:pre-wrap;word-break:break-word}
.cl{display:block;padding-right:16px;counter-increment:cl}
.cl::before{content:counter(cl);display:inline-block;width:2.9em;margin-right:14px;padding-right:10px;text-align:right;color:#4b5563;border-right:1px solid #23282e;user-select:none}
.tk-k{color:#bb9af7}
.tk-s{color:#9ece6a}
.tk-n{color:#ff9e64}
.tk-c{color:#636f83;font-style:italic}
.img-ph{display:inline-block;border:1px dashed var(--line2);border-radius:10px;padding:6px 12px;color:var(--faint);font-family:var(--mono);font-size:12px;margin:4px 0}
.tbl-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);background:var(--paper)}
.table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.table th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:10px 12px}
.table td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.table td.ctr,.table th.ctr{text-align:center}
.table td.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.table a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.table a:hover{border-bottom-color:var(--acc)}
.metrics-all .tbl-wrap{max-height:540px;overflow:auto}
.metrics-all .table thead th{position:sticky;top:0;background:var(--paper);z-index:1;box-shadow:0 1.5px 0 var(--ink)}
.metrics-all{margin-top:44px;border-top:1px solid var(--line);padding-top:18px}
.metrics-all h2{font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:10px}
.muted{color:var(--faint);font-size:13px}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:inherit}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media(max-width:560px){body{padding:14px}.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow">vizscape · report-basic · __THEME_UPPER__</div><h1>__TITLE__ <em>· 报告页</em></h1></div>
  <div class="seg" id="themeSeg" role="group" aria-label="主题"><button type="button" data-theme="light" aria-pressed="false">☀ 浅色</button><button type="button" data-theme="dark" aria-pressed="false">☾ 深色</button></div>
</header>

<div class="meta"><span>来源 <b>__SOURCE__</b></span><span>章节 <b>__SECTIONS_N__</b></span><span>指标 <b>__METRICS_N__</b></span><span>表格 <b>__TABLES_N__</b></span><span>字数 <b>__CHARS_N__</b></span></div>

<div class="deck">
  <div class="trow">
    <span class="label">排版</span>
    <div class="seg" id="sizeSeg" role="group" aria-label="正文字号"><button type="button" data-fs="14" aria-pressed="false">小</button><button type="button" data-fs="15" class="on" aria-pressed="true">标准</button><button type="button" data-fs="16.5" aria-pressed="false">大</button></div>
    <button class="toggle" id="btnWide" type="button" aria-pressed="false">⇤⇥ 宽版</button>
  </div>
</div>

<section class="kpi-grid" aria-label="关键指标">__KPI_HTML__</section>

__QUALITY_HTML__

<div class="layout">
  <aside class="side">
    __TOC_HTML__
    __SECTION_BARS_HTML__
  </aside>
  <article class="doc">
    __BODY_HTML__
  </article>
</div>

<section class="metrics-all" aria-label="指标明细">
  <h2>指标明细</h2>
  __METRICS_TABLE_HTML__
</section>

<footer><span>vizscape · report-basic · 离线单文件 · 图片不加载</span><span><a href="#">回到顶部 ↑</a></span></footer>
</div>
<script>
(function(){
  var seg=document.getElementById('themeSeg');
  var btns=[].slice.call(seg.querySelectorAll('button'));
  function setOn(el,on){el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on))}
  function syncTheme(){btns.forEach(function(b){setOn(b,document.documentElement.dataset.theme===b.dataset.theme)})}
  syncTheme();
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.theme;syncTheme()});
  var links=[].slice.call(document.querySelectorAll('.toc a'));
  var targets=links.map(function(a){return document.getElementById(a.getAttribute('href').slice(1))}).filter(Boolean);
  if('IntersectionObserver' in window && targets.length){
    var io=new IntersectionObserver(function(entries){entries.forEach(function(en){
      if(en.isIntersecting){links.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id)})}
    })},{rootMargin:'0px 0px -70% 0px'});
    targets.forEach(function(t){io.observe(t)});
  }
  // —— 排版控制：字号 / 宽版 ——
  var doc=document.querySelector('.doc');
  var sizeSeg=document.getElementById('sizeSeg');
  if(sizeSeg){sizeSeg.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;doc.style.fontSize=b.dataset.fs+'px';[].slice.call(sizeSeg.querySelectorAll('button')).forEach(function(x){setOn(x,x===b)})});}
  var btnWide=document.getElementById('btnWide');
  if(btnWide){btnWide.addEventListener('click',function(){var on=doc.classList.toggle('wide');setOn(btnWide,on)});}
  // —— 标题悬浮锚点（点击复制小节链接）——
  [].slice.call(document.querySelectorAll('.doc h2[id],.doc h3[id],.doc h4[id]')).forEach(function(h){
    var a=document.createElement('a');a.className='h-anchor';a.href='#'+h.id;a.textContent='#';a.title='复制本节链接';
    a.addEventListener('click',function(e){e.preventDefault();var url=location.href.split('#')[0]+'#'+h.id;try{if(navigator.clipboard)navigator.clipboard.writeText(url);}catch(_){/*noop*/}history.replaceState(null,'','#'+h.id);});
    h.appendChild(a);
  });
  // —— 代码块升级：头栏（语言 + 换行 + 复制）+ 行号 + 轻量语法高亮 ——
  var TOK=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|--[^\n]*|#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d[\d_]*(?:\.\d+)?)\b|\b(const|let|var|function|return|if|elif|else|for|while|do|import|from|export|default|class|extends|new|try|catch|except|finally|raise|throw|async|await|yield|with|as|in|is|not|and|or|pass|break|continue|def|lambda|print|select|insert|update|delete|create|drop|alter|table|into|values|where|group|order|by|having|limit|join|left|right|inner|outer|on|union|all|distinct|null|true|false|True|False|None|self|this|nil|public|private|static|void|int|float|string|bool)\b/g;
  function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function hi(line){
    var out='',last=0,m;TOK.lastIndex=0;
    while((m=TOK.exec(line))){
      out+=esc(line.slice(last,m.index));
      if(m[1]!=null)out+='<span class="tk-c">'+esc(m[0])+'</span>';
      else if(m[2]!=null)out+='<span class="tk-s">'+esc(m[0])+'</span>';
      else if(m[3]!=null)out+='<span class="tk-n">'+esc(m[0])+'</span>';
      else out+='<span class="tk-k">'+esc(m[0])+'</span>';
      last=m.index+m[0].length;
    }
    return out+esc(line.slice(last));
  }
  [].slice.call(document.querySelectorAll('pre.code')).forEach(function(pre){
    var codeEl=pre.querySelector('code');if(!codeEl)return;
    var langEl=pre.querySelector('.code-lang');
    var lang=(langEl?langEl.textContent:'text').trim().toUpperCase()||'TEXT';
    var raw=codeEl.textContent.replace(/\n$/,'');
    var html=raw.split('\n').map(function(l){return '<span class="cl">'+(hi(l)||'&#8203;')+'</span>'}).join('');
    var fig=document.createElement('figure');fig.className='codeblock';
    fig.innerHTML='<figcaption class="code-head"><span class="dots"><i></i><i></i><i></i></span><span class="lang">'+esc(lang)+'</span><span class="sp"></span><button type="button" class="cb-btn" data-act="wrap">⇋ 换行</button><button type="button" class="cb-btn" data-act="copy">⧉ 复制</button></figcaption><pre class="code-body"><code>'+html+'</code></pre>';
    pre.parentNode.replaceChild(fig,pre);
    var body=fig.querySelector('.code-body');
    fig.querySelector('[data-act="wrap"]').addEventListener('click',function(e){var on=body.classList.toggle('wrap');e.currentTarget.classList.toggle('on',on);});
    fig.querySelector('[data-act="copy"]').addEventListener('click',function(e){
      var btn=e.currentTarget;
      function done(){btn.textContent='✓ 已复制';setTimeout(function(){btn.textContent='⧉ 复制';},1400);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(done,done);}
      else{var ta=document.createElement('textarea');ta.value=raw;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){/*noop*/}document.body.removeChild(ta);done();}
    });
  });
})();
</script>
</body>
</html>
