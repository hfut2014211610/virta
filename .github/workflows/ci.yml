name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: '重新生成视觉基线（test:visual:update 并把 snapshots/ 作为 artifact 上传）'
        type: boolean
        default: false
        required: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Install CJK fonts and Playwright browser
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
      # 视觉基线以 Linux 为准（M2b.5）
      - if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:update
      - if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: snapshots/
          retention-days: 30
