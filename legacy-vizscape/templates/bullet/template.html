<!DOCTYPE html>
<html lang="zh-CN" data-theme="__THEME__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · vizscape bullet</title>
<style>
__SHARED_CSS__
html[data-theme="light"]{--bg:#f6f3ec;--paper:#fffdf7;--ink:#171a1e;--muted:#6b6f6a;--faint:#9a9d96;--line:#e2ded2;--line2:#d1ccc0;--acc:#0f766e;--good:#0f766e;--watch:#c69a4a;--miss:#b5412f;--band1:rgba(23,26,30,.18);--band2:rgba(23,26,30,.10);--band3:rgba(15,118,110,.10);--shadow:0 16px 48px rgba(23,26,30,.10);--grid:rgba(23,26,30,.06)}
html[data-theme="dark"]{--bg:#0d0e0a;--paper:#131410;--ink:#ede9dc;--muted:#9aa08a;--faint:#5e6450;--line:#23261d;--line2:#2e3323;--acc:#c6f13f;--good:#c6f13f;--watch:#ffb224;--miss:#ff6b4a;--band1:rgba(237,233,220,.20);--band2:rgba(237,233,220,.12);--band3:rgba(198,241,63,.10);--shadow:0 16px 48px rgba(0,0,0,.45);--grid:rgba(237,233,220,.05)}
body{background:radial-gradient(circle at 15% 8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 28rem),radial-gradient(circle at 88% 2%,color-mix(in srgb,var(--watch) 10%,transparent),transparent 30rem),var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:30px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:52px 52px;opacity:.65}
.wrap{max-width:1120px;margin:0 auto;position:relative}
.skip-link{position:absolute;left:0;top:-4rem;background:var(--acc);color:var(--paper);padding:.5rem .8rem;border-radius:.3rem;z-index:10;text-decoration:none}
.skip-link:focus{top:0}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:18px;margin-bottom:18px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(34px,5.6vw,64px);line-height:.96;letter-spacing:-.04em;margin-top:10px}
.seg{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line2);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13px;padding:9px 15px;border-radius:99px;cursor:pointer;font-family:var(--sans)}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.sum-card{display:inline-flex;align-items:baseline;gap:9px;border:1px solid var(--line2);background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:14px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.sum-card b{color:var(--ink);font-size:20px;font-weight:500;letter-spacing:-.02em}
.intro{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin:14px 0 10px}
.intro h2{font-family:var(--serif);font-weight:420;font-size:24px;letter-spacing:-.02em}
.intro p{color:var(--muted);font-size:13px;line-height:1.7;max-width:56ch}
#bulletRows{display:grid;gap:14px;margin-top:16px}
.bullet-row{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px 18px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s ease,border-color .2s ease}
#bulletRows.play .bullet-row{animation:rise .55s ease both;animation-delay:calc(var(--i)*70ms)}
.bullet-row:hover{transform:translateY(-2px);border-color:var(--acc)}
.bullet-row.miss{border-left:5px solid var(--miss)}
.bullet-row.watch{border-left:5px solid var(--watch)}
.bullet-row.hit{border-left:5px solid var(--good)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.row-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:13px}
.row-head h3{font-family:var(--serif);font-size:25px;font-weight:420;letter-spacing:-.02em}
.row-head p{font-family:var(--mono);color:var(--muted);font-size:12px;margin-top:5px}
.row-head p b{color:var(--ink);font-weight:500}
.row-badges{display:flex;align-items:center;gap:10px;flex-shrink:0}
.status{font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:7px 10px;border:1px solid}
.status.hit{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.status.watch{color:var(--watch);border-color:color-mix(in srgb,var(--watch) 45%,transparent);background:color-mix(in srgb,var(--watch) 14%,transparent)}
.status.miss{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 45%,transparent);background:color-mix(in srgb,var(--miss) 12%,transparent)}
.ratio{font-family:var(--serif);font-size:34px;font-weight:350;letter-spacing:-.04em;color:var(--ink)}
.track{position:relative;height:34px;background:var(--line2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.band{position:absolute;top:0;bottom:0}
.band.poor{left:0;width:var(--poor);background:var(--band1)}
.band.ok{left:var(--poor);width:calc(var(--good) - var(--poor));background:var(--band2)}
.band.good{left:var(--good);width:calc(100% - var(--good));background:var(--band3)}
.actual{position:absolute;left:0;top:0;bottom:0;width:var(--actual);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 70%,transparent),var(--acc));border-right:1px solid var(--acc);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.target-line{position:absolute;top:-5px;bottom:-5px;left:var(--target);width:3px;background:var(--ink);box-shadow:0 0 0 1px var(--paper),0 0 18px rgba(0,0,0,.25)}
.target-line::after{content:"目标";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink)}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--paper);opacity:.55;pointer-events:none}
#bulletRows:not(.ticks) .tick{display:none}
.gapchip{display:none;font-family:var(--mono);font-size:11px;border-radius:8px;padding:5px 8px;border:1px solid;line-height:1}
#bulletRows.gaps .gapchip{display:inline-block}
.gapchip.ahead{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.gapchip.behind{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 45%,transparent);background:color-mix(in srgb,var(--miss) 10%,transparent)}
#bulletRows.only-miss .bullet-row:not(.miss){display:none}
#bulletRows.only-miss:not(:has(.bullet-row.miss))::after{content:"🎉 没有偏离项 —— 全部指标达标或接近";border:1px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--mono)}
/* —— 紧凑布局：多行并入同一面板 —— */
#bulletRows.compact{gap:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
#bulletRows.compact .bullet-row{border:0;border-left:4px solid transparent;border-radius:0;box-shadow:none;padding:11px 18px 12px;border-bottom:1px solid var(--line)}
#bulletRows.compact .bullet-row:last-child{border-bottom:0}
#bulletRows.compact .bullet-row.miss{border-left-color:var(--miss)}
#bulletRows.compact .bullet-row.watch{border-left-color:var(--watch)}
#bulletRows.compact .bullet-row.hit{border-left-color:var(--good)}
#bulletRows.compact .bullet-row:hover{transform:none;background:color-mix(in srgb,var(--acc) 4%,transparent);border-bottom-color:var(--line)}
#bulletRows.compact .row-head{margin-bottom:8px;align-items:center}
#bulletRows.compact .row-head h3{font-size:19px}
#bulletRows.compact .row-head p{margin-top:3px;font-size:11px}
#bulletRows.compact .ratio{font-size:26px}
#bulletRows.compact .status{padding:5px 9px;font-size:10px}
#bulletRows.compact .gapchip{font-size:10px;padding:4px 7px}
#bulletRows.compact .track{height:20px;border-radius:6px}
#bulletRows.compact .target-line::after{display:none}
.seg.wrap{flex-wrap:wrap;border-radius:18px}
.quality{margin:18px 0 0}
.quality{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--paper);border-radius:16px;padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.02) inset}
.quality.warn{border-left-color:var(--miss)}
.quality-head h2{font-family:var(--serif);font-size:20px;font-weight:420}
.quality.warn .quality-score b{color:var(--miss)}
.quality-warnings{margin:11px 0 0;padding-left:18px;color:var(--miss);font-size:12px;line-height:1.75}
footer{margin-top:22px;font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.sort-hidden{display:none}
@media(max-width:760px){body{padding:18px}.row-head{display:block}.row-badges{margin-top:12px;justify-content:space-between}.ratio{font-size:28px}.target-line::after{display:none}.intro{display:block}.summary{margin-top:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#bulletRows">跳到指标列表</a>
<div class="wrap">
<header>
  <div><div class="eyebrow">vizscape · bullet · __THEME_UPPER__</div><h1>__TITLE__ <em>· 子弹图</em></h1></div>
  <div class="seg" id="themeSeg" aria-label="主题切换"><button type="button" data-theme="light">☀ 浅色</button><button type="button" data-theme="dark">☾ 深色</button></div>
</header>

<div class="intro">
  <div><h2>KPI 达标扫描</h2><p>黑线是目标，长条是实际，三段浅底是“只能接受 / 尚可 / 良好”的定性刻度。沿着最红的行读下去，先修最大的偏离。</p></div>
</div>

<div class="deck">
  <div class="trow">
    <span class="label">布局</span>
    <div class="seg" id="layoutSeg" aria-label="布局密度"><button type="button" data-layout="card" class="on" aria-pressed="true">▦ 卡片</button><button type="button" data-layout="compact" aria-pressed="false">☰ 紧凑</button></div>
    <span class="label">排序</span>
    <div class="seg" id="sortSeg" aria-label="排序方式"><button type="button" data-sort="original" class="on" aria-pressed="true">原顺序</button><button type="button" data-sort="ratio" aria-pressed="false">达成率 低→高</button><button type="button" data-sort="gap" aria-pressed="false">差距 大→小</button></div>
    <span class="label">视图</span>
    <button class="toggle" id="btnMiss" type="button" aria-pressed="false">⚠ 只看落后</button>
    <button class="toggle" id="btnGap" type="button" aria-pressed="false">± 差距标注</button>
    <button class="toggle" id="btnTick" type="button" aria-pressed="false">┊ 刻度</button>
    <span class="spacer"></span>
    <button class="toggle" id="btnReplay" type="button">▶ 重播动画</button>
  </div>
  <div class="trow">
    <span class="label">风格</span>
    <div class="seg wrap" id="paletteSeg" aria-label="配色风格">
      <button type="button" data-palette="signal" class="on" aria-pressed="true">Signal</button>
      <button type="button" data-palette="cinnabar" aria-pressed="false">朱砂</button>
      <button type="button" data-palette="patina" aria-pressed="false">铜绿</button>
      <button type="button" data-palette="blueprint" aria-pressed="false">蓝图</button>
      <button type="button" data-palette="inkwash" aria-pressed="false">水墨</button>
      <button type="button" data-palette="mono" aria-pressed="false">单色</button>
      <button type="button" data-palette="sundown" aria-pressed="false">落日</button>
      <button type="button" data-palette="dunhuang" aria-pressed="false">敦煌</button>
      <button type="button" data-palette="aurora" aria-pressed="false">极光</button>
      <button type="button" data-palette="morandi" aria-pressed="false">莫兰迪</button>
    </div>
  </div>
</div>

<div class="summary" id="summaryCards" aria-label="摘要">__SUMMARY_CARDS__</div>

__QUALITY_HTML__

<main id="bulletRows" aria-label="指标列表">
__ROWS_HTML__
</main>

<footer><span>vizscape · bullet · actual / target / poor / good / max</span><span>来源 __SOURCE__ · 输入兼容 csv / json / xlsx</span></footer>
</div>
<script>
const rowsRoot=document.getElementById('bulletRows');
const originalOrder=[...rowsRoot.children];
document.querySelectorAll('#themeSeg button').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.theme;document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b))}));
document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',document.documentElement.dataset.theme===b.dataset.theme));
document.getElementById('sortSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const mode=b.dataset.sort;
  document.querySelectorAll('#sortSeg button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});
  const rows=[...originalOrder];
  if(mode==='ratio') rows.sort((a,b)=>(+a.dataset.ratio)-(+b.dataset.ratio));
  else if(mode==='gap') rows.sort((a,b)=>(+a.dataset.gap)-(+b.dataset.gap));
  rows.forEach(row=>rowsRoot.appendChild(row));
});
// 布局密度：卡片 / 紧凑
document.getElementById('layoutSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  rowsRoot.classList.toggle('compact',b.dataset.layout==='compact');
  document.querySelectorAll('#layoutSeg button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});
});
// 风格（只换主色，语义色 达标/接近/偏离 不随动）
document.getElementById('paletteSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.documentElement.dataset.palette=b.dataset.palette;
  document.querySelectorAll('#paletteSeg button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});
});
// 视图增强：刻度线 / 差距 chip / 只看落后 / 重播
const fmtG=v=>Math.abs(v)>=10?Math.round(v).toLocaleString():(+v.toFixed(2)).toLocaleString();
document.querySelectorAll('.track').forEach(t=>{[25,50,75].forEach(p=>{const d=document.createElement('div');d.className='tick';d.style.left=p+'%';t.appendChild(d)})});
document.querySelectorAll('.bullet-row').forEach(r=>{
  const gap=+r.dataset.gap, c=document.createElement('span');
  c.className='gapchip '+(gap>=0?'ahead':'behind');
  c.textContent=(gap>=0?'+':'−')+fmtG(Math.abs(gap));
  r.querySelector('.row-badges').prepend(c);
});
function setOn2(el,on){el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on))}
document.getElementById('btnMiss').onclick=e=>{const on=rowsRoot.classList.toggle('only-miss');setOn2(e.currentTarget,on)};
document.getElementById('btnGap').onclick=e=>{const on=rowsRoot.classList.toggle('gaps');setOn2(e.currentTarget,on)};
document.getElementById('btnTick').onclick=e=>{const on=rowsRoot.classList.toggle('ticks');setOn2(e.currentTarget,on)};
document.getElementById('btnReplay').onclick=()=>{rowsRoot.classList.remove('play');void rowsRoot.offsetWidth;rowsRoot.classList.add('play')};
rowsRoot.classList.add('play');
</script>
</body>
</html>
